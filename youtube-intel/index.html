<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Intelligence Extractor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo svg { width: 32px; height: 32px; }
  .logo-text { font-size: 18px; font-weight: 600; color: #fff; }
  h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  p.sub { font-size: 14px; color: #888; margin-bottom: 28px; line-height: 1.5; }

  label { display: block; font-size: 13px; font-weight: 500; color: #aaa; margin-bottom: 6px; }
  input[type="url"], input[type="number"] {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  input:focus { border-color: #e63946; }
  input::placeholder { color: #555; }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  button {
    width: 100%;
    background: #e63946;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 4px;
  }
  button:hover { background: #c1121f; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .divider { border: none; border-top: 1px solid #2a2a2a; margin: 24px 0; }

  .status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    line-height: 1.6;
  }
  .status.info { background: #1e2a3a; border: 1px solid #1d4ed8; color: #93c5fd; }
  .status.success { background: #0f2a1a; border: 1px solid #15803d; color: #86efac; }
  .status.error { background: #2a0f0f; border: 1px solid #991b1b; color: #fca5a5; }

  .hint {
    font-size: 12px;
    color: #555;
    margin-top: -10px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .examples {
    margin-top: 16px;
    font-size: 12px;
    color: #555;
  }
  .examples a {
    color: #888;
    text-decoration: none;
    cursor: pointer;
  }
  .examples a:hover { color: #aaa; text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="8" fill="#e63946"/>
      <path d="M12 10L22 16L12 22V10Z" fill="white"/>
    </svg>
    <span class="logo-text">YouTube Intelligence</span>
  </div>

  <h1>Extract Creator Intelligence</h1>
  <p class="sub">Paste a YouTube channel or video URL. Pulls transcripts, metadata, and GPT-4o insights — saved as a markdown file in Google Drive.</p>

  <hr class="divider">

  <form id="form">
    <label for="url">YouTube URL</label>
    <input
      type="url"
      id="url"
      name="url"
      placeholder="https://www.youtube.com/@creator or https://youtu.be/VIDEO_ID"
      required
      autocomplete="off"
      spellcheck="false"
    >

    <div class="row">
      <div class="field">
        <label for="limit">Videos per type <span style="color:#555">(channel only)</span></label>
        <input type="number" id="limit" name="limit" value="10" min="1" max="50">
        <p class="hint">Fetches top X newest + top X most popular. Ignored for single videos.</p>
      </div>
    </div>

    <button type="submit" id="btn">Run Extraction</button>
  </form>

  <div class="status" id="status"></div>

  <div class="examples">
    Try:
    <a onclick="document.getElementById('url').value='https://www.youtube.com/@nicksaraev/videos'">@nicksaraev</a> &nbsp;|&nbsp;
    <a onclick="document.getElementById('url').value='https://www.youtube.com/watch?v=K65vd9EYbDU'">single video</a>
  </div>
</div>

<script>
const WEBHOOK = 'https://n8n.americanlifeteam.com/webhook/youtube-intelligence';

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const url = document.getElementById('url').value.trim();
  const limit = parseInt(document.getElementById('limit').value) || 10;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Starting…';
  status.className = 'status info';
  status.style.display = 'block';
  status.textContent = 'Sending to n8n…';

  try {
    const resp = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, limit })
    });

    if (resp.status === 200 || resp.status === 202) {
      status.className = 'status success';
      status.innerHTML = '<strong>Processing started.</strong><br>' +
        'The workflow is running in the background (typically 1-3 minutes per video).<br>' +
        'Check <a href="https://drive.google.com/drive/folders/1CQcfZl_yudXIRezfv0gNT-PEGRohAHfn" target="_blank" style="color:#86efac">Google Drive</a> for the markdown file once complete.<br><br>' +
        '<small style="color:#4ade80">URL: ' + url + '</small>';
    } else {
      const text = await resp.text().catch(() => '');
      status.className = 'status error';
      status.textContent = 'Error ' + resp.status + ': ' + (text.slice(0,200) || 'Unknown error');
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Network error: ' + err.message + '. Make sure n8n is running.';
  }

  btn.disabled = false;
  btn.innerHTML = 'Run Extraction';
});
</script>
</body>
</html>
